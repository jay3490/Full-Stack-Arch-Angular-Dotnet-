<body><div class="container" style="padding-top:4em;">
    <h3>Forgot Password</h3>
    <form id="form" class="needs-validation" enctype="multipart/form-data" novalidate="novalidate">
        <div class="form-horizontal">
            <hr>
            <div class="text-success" id="successmsg" style="display:none">
                Reset password link has been sent to your email id.
            </div>
            <div class="text-danger" id="failemsg" style="display:none">
                Account Not Found.
            </div>
            <div class="form-group col-md-4">
                <label class="control-label col-lg-4">Email ID</label>
                <br>
                <input class="form-control" data-val="true" data-val-regex="Invalid Email ID" data-val-regex-pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,4}$" data-val-required="Email Id is required." id="EmailId" name="EmailId" type="text" value="">
                <span class="field-validation-valid text-danger" data-valmsg-for="EmailId" data-valmsg-replace="true"></span>
            </div>
            <div class="form-group" style="padding-top:1em;">
                <div class="col-md-offset-2 col-md-10">
                        <input type="submit" value="Submit" class="btn btn-primary">
                </div>
            </div>
        </div>
    </form>
</div>
